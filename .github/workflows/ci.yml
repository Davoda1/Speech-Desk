name: Build and focused tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Qt 6.8.3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux_gcc_64
            tools: ''
          - os: windows-2022
            arch: win64_mingw
            tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Qt and compiler
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          tools: ${{ matrix.tools }}
          cache: true
          setup-python: false
          add-tools-to-path: true
      - name: Install Windows dependency build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.33.0
        id: msys2
        with:
          msystem: MSYS
          update: false
          install: make
          path-type: inherit
      - name: Build pinned crypto dependency on Linux
        if: runner.os == 'Linux'
        run: python vendor/tools/build_sodium.py --output build/deps/sodium --cc gcc --jobs 3
      - name: Build pinned crypto dependency on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python vendor/tools/build_sodium.py --output build/deps/sodium --cc (Get-Command gcc).Source --shell "$env:MSYS2_LOCATION/usr/bin/bash.exe" --make "$env:MSYS2_LOCATION/usr/bin/make.exe" --jobs 3
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DSPEECHDESK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Focused transport, text and model-pack tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 90
      - name: Show UI assertion report on failure
        if: failure()
        run: python -c "from pathlib import Path; p = Path('build/ui-profiles.txt'); print(p.read_text(encoding='utf-8', errors='replace') if p.is_file() else 'UI test report was not produced.')"
      - name: Validate packaging scripts
        run: python -m compileall -q packaging vendor/tools vendor/native/build_audio.py
