name: Release packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optional-models:
    name: Build complete optional-model ZIPs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Download pinned weights and create complete add-on ZIPs
        run: python packaging/create_model_packs.py --download --models .cache/optional-models --output dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-models
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  native-assets:
    name: Reconstruct pinned native dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Download verified models and build native engines
        run: python vendor/tools/bootstrap_native.py --platform all --jobs 3
      - name: Preserve executable modes for platform builds
        run: tar -czf native-assets.tar.gz -C vendor assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-assets
          path: native-assets.tar.gz
          compression-level: 0
          retention-days: 3
  packages:
    name: Package ${{ matrix.platform }}
    needs: native-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: linux_gcc_64
            tools: ''
          - os: windows-2022
            platform: windows
            arch: win64_mingw
            tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Qt and compiler
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: 'qtmultimedia qtshadertools'
          tools: ${{ matrix.tools }}
          cache: true
          setup-python: false
          add-tools-to-path: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-assets
      - name: Extract verified assets
        run: python -c "import tarfile; tarfile.open('native-assets.tar.gz').extractall('vendor', filter='data')"
      - name: Install documentation tools
        run: python -m pip install Markdown==3.7
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libxcb-cursor0
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DSPEECHDESK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 3
      # Use the native Windows shell so Git Bash's DLL directories cannot
      # shadow the MinGW runtime installed with Qt when tests start.
      - name: Focused transport, text and model-pack tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 90
      - name: Generate release documentation
        run: python packaging/create_documents.py --source . --output dist --screenshots docs/extras
      - name: Stage Windows portable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/package_windows.py --binary build/SpeechDesk.exe --qt "$env:QT_ROOT_DIR" --assets vendor/assets --output staging/windows --compiler g++ --objdump objdump
      - name: Stage Linux portable runtime
        if: runner.os == 'Linux'
        shell: bash
        run: python packaging/package_linux.py --binary build/speechdesk --qt "$QT_ROOT_DIR" --assets vendor/assets --output staging/linux
      - name: Archive packages and validate layout
        run: python packaging/archive_release.py --platform ${{ matrix.platform }} --runtime staging/${{ matrix.platform }} --output dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          compression-level: 0
          retention-days: 14
  assemble:
    name: Assemble source and one checksum manifest
    needs: [packages, optional-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Source archives and checksums
        run: |
          python packaging/archive_release.py --platform source --output dist
          python packaging/archive_release.py --platform checksums --output dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SpeechDesk-1.0.0-release-files
          path: dist/*
          compression-level: 0
          retention-days: 14
  draft-release:
    name: Attach verified packages to draft release
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: SpeechDesk-1.0.0-release-files
          path: dist
      - name: Verify checksums and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          (cd dist && sha256sum --check SHA256SUM.txt)
          if gh release view v1.0.0 --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true || { echo "Refusing to replace a published release."; exit 1; }
            gh release edit v1.0.0 --draft --target "$GITHUB_SHA" --title "SpeechDesk 1.0.0" --notes-file .github/RELEASE_TEMPLATE.md
          else
            gh release create v1.0.0 --draft --target "$GITHUB_SHA" --title "SpeechDesk 1.0.0" --notes-file .github/RELEASE_TEMPLATE.md
          fi
          gh release upload v1.0.0 dist/* --clobber
